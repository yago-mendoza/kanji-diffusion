[project]
name = "kanji-diffusion"
version = "0.2.0"
description = "A small text-conditioned diffusion model that invents kanji from English definitions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yago Mendoza" }]
dependencies = [
  "torch>=2.2",
  "diffusers>=0.30",
  "transformers>=4.44",
  "pillow>=10",
  "numpy>=1.26",
  "svg.path>=6.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kanji_diffusion"]
